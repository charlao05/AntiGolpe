<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntiGolpe</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="container"><header><h1>Recebeu algo suspeito?</h1><p>Analise a situação antes de agir. O AntiGolpe não promete segurança absoluta.</p></header><section class="states"><button data-state="AINDA_NAO_AGI">Recebi algo estranho</button><button data-state="ESTOU_EM_DUVIDA">Estou em dúvida</button><button data-state="JA_AGI">Já cliquei / respondi</button><button class="emergency" data-state="JA_FUI_VITIMA">JÁ FUI VÍTIMA</button></section><form id="analysis-form"><label>Mensagem ou contexto<textarea id="text" maxlength="12000" placeholder="Cole a mensagem ou descreva a situação."></textarea></label><label>URL (opcional)<input id="url" maxlength="4096" inputmode="url" placeholder="https://..."></label><label>Contexto adicional (opcional)<textarea id="situation" maxlength="4000"></textarea></label><p class="privacy">Evite enviar senhas, códigos de autenticação, cartões completos ou outras informações altamente sensíveis.</p><button class="primary" type="submit">Analisar situação</button></form><section id="result" class="result" hidden></section></main><script src="/assets/app.js" defer></script></body></html>
